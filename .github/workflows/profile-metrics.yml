name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [master, main]
    paths:
      - scripts/update-metrics.mjs
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'KD9Sa/KD9Sa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Refresh verified public metrics
        run: node scripts/update-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the refreshed graphics and snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile metrics"
            git push
          fi
